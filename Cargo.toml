[package]
name = "tree-sitter-factor"
description = "Factor grammar for the tree-sitter parsing library"
version = "0.1.0"
keywords = ["incremental", "parsing", "factor"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/shnarazk/tree-sitter-factor"
edition = "2024"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "^0.27"

[build-dependencies]
cc = "1.0"
